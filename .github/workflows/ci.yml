name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (no Airflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt

      - name: Import and replay historical cases without seeding
        run: |
          python manage.py --db /tmp/ptm-import.db import expenses examples/expenses.csv
          python manage.py --db /tmp/ptm-import.db import expenses examples/expenses.csv --write
          python manage.py --db /tmp/ptm-import.db replay expenses v2
          python manage.py --db /tmp/ptm-import.db coverage expenses v2
          python manage.py --db /tmp/ptm-import.db snapshots expenses v2 -o /tmp/ptm-evidence.json
          python -c "import json; rows=json.load(open('/tmp/ptm-evidence.json')); assert rows[0]['status'] == 'complete' and rows[0]['inputs'] and rows[0]['verdicts']"

      # The engine's dependencies are four packages and they are ours to move,
      # so an advisory here is both actionable and this project's problem, and
      # the step fails. Deliberately *not* run over requirements.txt: auditing a
      # scheduler's transitive tree produces findings nobody in the pull request
      # can act on, and a gate that is red for unrelated reasons is one people
      # learn to skip - the same argument this project makes about a precedent
      # gate that passes because the check was switched off. Airflow's tree is
      # handled by Dependabot instead, which proposes upgrades rather than
      # blocking unrelated work. See .github/dependabot.yml.
      - name: Audit the engine's dependencies
        run: |
          pip install --upgrade setuptools pip-audit
          pip-audit --strict --desc

      # The code carries `# noqa` directives and nothing here could honour them,
      # so three of them had gone stale and no build said so. ruff.toml explains
      # which rules are on and why each one is worth failing a build over - the
      # selection is about correctness and drift, not house style.
      - name: Style
        run: ruff check .

      # The domain YAML must still implement the policies it cites. This is the
      # check that catches an offline rule quietly no longer matching anything.
      - name: Lint domain configuration
        run: python -m ptm.lint
        env:
          PTM_INCLUDE_DIR: ./include

      # With coverage, and the floor is coverage's own `fail_under` in
      # pyproject.toml rather than a flag here - so `make coverage` and this
      # step cannot disagree about what passing means. Scoped to ptm/: the DAG
      # modules are proved by parsing under a real Airflow in the next job,
      # which is a different question from how many of their lines ran.
      - name: Test suite, with the coverage floor
        run: python -m pytest --cov=ptm --cov-report=term-missing

      # Proves the whole loop runs end to end with no Airflow and no API key,
      # which is also how the demo is rehearsed.
      - name: Whole loop end to end
        run: |
          python -m ptm.selftest
          python -m ptm.selftest refunds v2
          python -m ptm.pit_check
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # Attribution stops at "clause 1.1 moves 48 decisions". This is the step
      # after it, and it runs here because it is pure computation over the
      # shipped fixture - no model, no key, no bill.
      # The step after the curve. A single sweep holds every other threshold
      # still and never says so, which is the assumption a reader inherits
      # without noticing - the joint form is the one that shows whether it
      # survives. Both in one step, so the env block cannot drift away from a
      # command the way it did when this was split.
      - name: Threshold sweep
        run: |
          python -m ptm.sweep expenses v2
          python -m ptm.sweep expenses v2 1.1 amount_gbp 25,50,75,100,150,250
          python -m ptm.sweep expenses v2 --joint \
            1.1:amount_gbp=25,50,75,100,150 3.1:days_notice=3,7,14,21
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # Every entry point answers --help, and answers it without doing any
      # work. It is a small thing to check and it was not true: eight of the
      # nine read --help as the name of a domain, and ptm.selftest got as far
      # as trying to seed one and exited on a traceback. Exit status is the
      # assertion - `set -e` fails this step if any of them returns non-zero.
      #
      # The list was written from that count of nine and then fell behind it:
      # ptm.seed and ptm.pit_check kept the old behaviour with nothing to say
      # so, and `python -m ptm.seed --help` did not merely fail to print usage,
      # it seeded every domain. The list is now also asserted against the
      # modules that actually have a main() - see tests/test_cli_and_retention.py
      # - so this loop cannot silently cover less than it claims again.
      - name: Every entry point answers --help
        run: |
          for m in preflight calibration rules lint prune sweep report proposal \
                   selftest seed pit_check gate precedents stability crosscheck \
                   disparity ingest provenance replay; do
            python -m ptm.$m --help > /dev/null
          done
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # The checks that need no model and no key, run against the shipped
      # fixture so a change that breaks one of them fails here rather than in
      # front of an audience. The proposal step deliberately omits --write:
      # proposing and adopting are separate acts, and CI does not adopt.
      #
      # ptm.calibration exits non-zero on a domain whose calibration.gate is
      # 'fail', so this step is also where a judge that has drifted away from
      # the humans stops a build. Offline it is inert and says so.
      - name: Policy and judge checks
        run: |
          python -m ptm.preflight expenses
          python -m ptm.preflight refunds
          python -m ptm.rules expenses v2
          python -m ptm.calibration expenses v2
          python -m ptm.proposal expenses v2
          python -m ptm.proposal expenses --list
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # The regression suite this whole project is for, run the way CI runs
      # everything else. It was the one measurement with no entry point: the
      # lint, the preflight, the sweep and the calibration score all ran here
      # and the gate could only be reached by starting Airflow. It reads the
      # verdicts the steps above stored, so it costs nothing and checks the
      # same numbers the dashboard shows.
      #
      # --introduced-only because the shipped fixture's status quo reverses two
      # rulings and the candidate introduces neither; failing on those would be
      # failing this build for a decision nobody in it made. Drop the flag to
      # hold a policy to every ruling on file, which is what the DAG does.
      - name: The precedent gate
        run: |
          python -m ptm.gate expenses v2 --introduced-only
          python -m ptm.gate refunds v2 --introduced-only --offline-judge
          # --json puts the reversals themselves on stdout rather than only the
          # exit code, which is what lets a CI step post them instead of saying
          # that there were some. Prose goes to stderr, so this parse is the
          # assertion that the two streams stay separated.
          python -m ptm.gate expenses v2 --introduced-only --json 2>/dev/null |
            python -c "import json,sys; d=json.load(sys.stdin); \
              assert d['code'] == 0 and d['passed'], d['headline']; \
              print(len(d['violations']), 'reversal(s),', len(d['introduced']), 'introduced')"
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # What this much history could have detected in the first place. Cheap,
      # and the one band here that is not about a measurement already taken -
      # two versions differing by less than it differ by sample size before
      # they differ by policy.
      - name: Sample size
        run: |
          python -m ptm.report expenses v2 --power
          python -m ptm.report expenses v2 --power --target 0.20
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # The three measurements that used to be reachable only by triggering a
      # DAG. Offline the stability figure and the cross-check are inert and say
      # so on their own last line, which is exactly why they run here: the thing
      # being proved is that the sampling, the confirmation pass, the storage
      # and the reading all still work end to end, not that a deterministic
      # judge agrees with itself. The disparity check is *not* inert - it reads
      # the blast radius the replay above stored - so this is a real gate.
      - name: Judge noise, a second opinion, and who the change lands on
        run: |
          python -m ptm.stability expenses v2 --cases 12 --samples 3
          python -m ptm.stability expenses v2 --target flips --cases 8
          python -m ptm.stability expenses v2 --show
          python -m ptm.crosscheck expenses v2
          python -m ptm.disparity expenses v2
          python -m ptm.disparity expenses v2 --json > /dev/null
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # Did the edit help? The one question the whole loop is for, and the read
      # models behind it lived only on a FastAPI route behind an Airflow login
      # until they had these two flags. --compare is checked against a version
      # pair the fixture actually has verdicts for, so an empty comparison here
      # is a regression rather than a configuration.
      - name: Compare two versions, and the whole history
        run: |
          python -m ptm.report expenses --compare v1 v2
          python -m ptm.report expenses --history
          python -m ptm.report expenses --compare v1 v2 --json |
            python -c "import json,sys; d=json.load(sys.stdin); \
              assert d['compared'], 'nothing compared'; \
              print(d['differ'], 'difference(s) over', d['compared'], 'case(s)')"
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # Precedents are the only output here that cannot be recomputed, and the
      # only one worth moving between databases. Round-tripped rather than
      # merely exported: an export nothing can read back is a backup nobody has
      # tested. The re-import must be a no-op - every ruling already on file and
      # saying the same thing - which is what exit 0 asserts.
      - name: Precedents round-trip
        run: |
          python -m ptm.precedents expenses -o /tmp/rulings.json
          python -c "import json; p=json.load(open('/tmp/rulings.json'));             assert p['format'] == 'ptm-precedents/1', p['format'];             print(len(p['precedents']), 'ruling(s),', len(p['superseded']), 'superseded')"
          python -m ptm.precedents expenses --import /tmp/rulings.json
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # The other artefact that could leave a database and not enter one. A
      # regression suite travelling between environments while the evidence for
      # how it was established stays behind is half a migration, and the
      # precedent step above makes exactly this argument about exports nobody
      # has read back. The re-import must be a no-op: every run already on file.
      - name: Evidence round-trip
        run: |
          python -m ptm.provenance expenses v2 --export -o /tmp/evidence-set.json
          python -c "import json; d=json.load(open('/tmp/evidence-set.json'));             assert d['format'] == 'ptm-snapshots/1', d['format'];             print(len(d['snapshots']), 'archived run(s)')"
          python -m ptm.provenance expenses v2 --import /tmp/evidence-set.json
          python -m ptm.provenance expenses --resolve
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # Two runs of one version, which is a different question from two
      # versions. Run against the imported database from the first step rather
      # than the shipped fixture, and deliberately: the fixture's runs come
      # from a backfill, so every one of them covers a *disjoint* month and no
      # two of them share a case. Comparing two of those is a comparison over
      # nothing, which is exactly the answer this reports and exactly the wrong
      # thing to assert a feature works from. Replaying one window twice is
      # what makes the comparison mean something.
      #
      # The assertions are the two halves of the claim: every case reproduces,
      # and the causes come back *decided* rather than unknown - an unknown here
      # would mean the snapshots stopped carrying the hashes they are for.
      - name: Two runs of one version
        run: |
          python -m ptm.replay expenses v2 > /dev/null
          python -m ptm.report expenses v2 --runs
          python -m ptm.report expenses v2 --rerun
          python -m ptm.report expenses v2 --rerun --json |
            python -c "import json,sys; d=json.load(sys.stdin); \
              assert d['compared'], 'the two runs shared no cases'; \
              assert d['changed_between'] == {'policy':'same','baseline_policy':'same','inputs':'same'}, d['changed_between']; \
              assert d['differ'] == 0, d['differences']; \
              print('reproducible over', d['compared'], 'shared case(s)')"
          # And the fixture's own backfill, where the honest answer is a
          # refusal. A version replayed only in slices cannot be compared with
          # itself, and saying 'every case agreed' about no cases is the one
          # reading this must never produce.
          PTM_DB=./include/ptm.db python -m ptm.report expenses v2 --rerun |
            grep -q "no case in common"
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: /tmp/ptm-import.db
          PTM_OFFLINE: "1"

      # The bundle is the one artefact built to *leave* the dashboard, so it is
      # the one most likely to break unnoticed: nothing else serialises every
      # read model at once. Written to a file and parsed back, because a
      # traceback here is a panel that would have been blank in front of an
      # audience. Pruning runs as a dry run - CI has nothing old to drop, and
      # the point is that the counting query still matches the deleting one.
      - name: Export and retention
        run: |
          python -m ptm.report --list
          python -m ptm.report expenses v2 -o /tmp/bundle.json
          python -c "import json; b=json.load(open('/tmp/bundle.json'));             assert b['summary']['flips'], 'bundle carries no flips';             assert b['caveats'], 'bundle lost its caveats';             print(len(b), 'sections,', len(b['flips']), 'flips')"
          python -m ptm.report expenses v2 --csv -o /tmp/flips.csv
          python -m ptm.prune --dry-run
          # And the deleting path, with the compaction on the end of it. A dry
          # run only proves the counting query works; this is the one that
          # proves the statements it counted with can actually execute, and
          # that VACUUM runs outside a transaction - which it has to, and which
          # nothing else here would notice. --days 99999 removes nothing, so
          # the fixture the later steps read is untouched.
          python -m ptm.prune --days 99999 --vacuum
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

  dags:
    name: DAGs parse under Airflow 3.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow 3.1 and providers
        run: pip install -r requirements.txt pytest

      # Proves the install actually produced an importable Airflow. Without
      # this the DAG-parse tests below just skip, and the job reports success
      # having run none of them.
      - name: Airflow imports
        run: |
          python -c "import airflow; print('airflow', airflow.__version__)"
          python -c "import airflow.sdk; print('airflow.sdk ok')"
          python -c "from airflow.providers.standard.operators.hitl import HITLOperator; print('HITLOperator ok')"

      # Both configurations, because the LLM-backed branch imports operators the
      # offline branch never touches - so offline-only parsing proves half of it.
      - name: Parse with the offline judge
        run: python -m pytest tests/test_dags.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"
          PYTHONPATH: .
          PTM_REQUIRE_AIRFLOW: "1"

      - name: Parse with the LLM judge
        run: python -m pytest tests/test_dags.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "0"
          PYTHONPATH: .
          PTM_REQUIRE_AIRFLOW: "1"

      # The plugin is meant to be nothing but routing, which is why the read
      # models are covered without a web framework. Status codes, query bounds,
      # download headers and the exact URLs the page asks for only exist here.
      - name: Plugin routes
        run: python -m pytest tests/test_plugin.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"
          PYTHONPATH: .
          PTM_REQUIRE_PLUGIN: "1"

  # `docker compose up --build -d` is the first command in the README and was
  # the one thing no job here ran. A broken Dockerfile, a compose file whose
  # environment block has drifted from .env.example, a plugin that does not
  # mount - all of it shipped unnoticed, because every other job installs the
  # dependencies its own way and never builds the image anybody actually uses.
  docker:
    name: The demo stack builds and serves the Explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # include/ contains the database and fixtures. The checkout is owned by
      # the runner user, so the container running as user airflow (50000) needs
      # write permissions to create and write to include/ptm.db.
      - name: Make include directory writable for the demo container
        run: chmod 777 include

      # --wait blocks on the healthcheck in docker-compose.yaml, which polls the
      # Explorer's own API. So this step passing already means Airflow migrated,
      # parsed the DAGs and mounted the plugin; it fails rather than hangs if any
      # of that never happens.
      - name: Build and start it the way the README says to
        run: docker compose up --build -d --wait

      # Unauthenticated on purpose. The compose file sets
      # simple_auth_manager_all_admins and the plugin still authenticates every
      # route against Airflow's token - SimpleAllAdminMiddleware is what supplies
      # one. That the two work together is a claim the compose file makes in a
      # comment and that nothing checked; this is where it gets checked.
      - name: The Explorer answers, and knows about the seeded domain
        run: |
          curl -fsS http://localhost:8080/ptm/api/domains | tee /dev/stderr | grep -q expenses
          curl -fsS http://localhost:8080/ptm/ | grep -qi "<html"

      # The seed runs in the container command, so the fixture the Explorer is
      # serving is the shipped one and the summary must be non-empty. A stack
      # that comes up healthy and serves an empty database is the failure this
      # job would otherwise report as success.
      - name: It is serving real history
        run: |
          docker compose exec -T airflow python -m ptm.lint
          docker compose exec -T airflow python -m ptm.selftest | tail -5

      - name: Logs, if any of that failed
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v

  dashboard:
    name: Diff Explorer renders in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow, the plugin's dependencies and Playwright
        run: |
          pip install -r requirements.txt pytest playwright
          playwright install --with-deps chromium

      # Every other job proves the data is right. None of them proves the page
      # renders it - a renderer reading a field the API no longer returns
      # leaves the suite green and the dashboard blank.
      - name: Load the dashboard and click through it
        run: python -m pytest tests/test_dashboard.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"
          PYTHONPATH: .
          PTM_REQUIRE_BROWSER: "1"
