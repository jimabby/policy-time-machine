name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (no Airflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt

      # The code carries `# noqa` directives and nothing here could honour them,
      # so three of them had gone stale and no build said so. ruff.toml explains
      # which rules are on and why each one is worth failing a build over - the
      # selection is about correctness and drift, not house style.
      - name: Style
        run: ruff check .

      # The domain YAML must still implement the policies it cites. This is the
      # check that catches an offline rule quietly no longer matching anything.
      - name: Lint domain configuration
        run: python -m ptm.lint
        env:
          PTM_INCLUDE_DIR: ./include

      - name: Test suite
        run: python -m pytest -q

      # Proves the whole loop runs end to end with no Airflow and no API key,
      # which is also how the demo is rehearsed.
      - name: Whole loop end to end
        run: |
          python -m ptm.selftest
          python -m ptm.selftest refunds v2
          python -m ptm.pit_check
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # Attribution stops at "clause 1.1 moves 48 decisions". This is the step
      # after it, and it runs here because it is pure computation over the
      # shipped fixture - no model, no key, no bill.
      # The step after the curve. A single sweep holds every other threshold
      # still and never says so, which is the assumption a reader inherits
      # without noticing - the joint form is the one that shows whether it
      # survives. Both in one step, so the env block cannot drift away from a
      # command the way it did when this was split.
      - name: Threshold sweep
        run: |
          python -m ptm.sweep expenses v2
          python -m ptm.sweep expenses v2 1.1 amount_gbp 25,50,75,100,150,250
          python -m ptm.sweep expenses v2 --joint \
            1.1:amount_gbp=25,50,75,100,150 3.1:days_notice=3,7,14,21
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # The checks that need no model and no key, run against the shipped
      # fixture so a change that breaks one of them fails here rather than in
      # front of an audience. The proposal step deliberately omits --write:
      # proposing and adopting are separate acts, and CI does not adopt.
      #
      # ptm.calibration exits non-zero on a domain whose calibration.gate is
      # 'fail', so this step is also where a judge that has drifted away from
      # the humans stops a build. Offline it is inert and says so.
      - name: Policy and judge checks
        run: |
          python -m ptm.preflight expenses
          python -m ptm.preflight refunds
          python -m ptm.rules expenses v2
          python -m ptm.calibration expenses v2
          python -m ptm.proposal expenses v2
          python -m ptm.proposal expenses --list
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

      # The bundle is the one artefact built to *leave* the dashboard, so it is
      # the one most likely to break unnoticed: nothing else serialises every
      # read model at once. Written to a file and parsed back, because a
      # traceback here is a panel that would have been blank in front of an
      # audience. Pruning runs as a dry run - CI has nothing old to drop, and
      # the point is that the counting query still matches the deleting one.
      - name: Export and retention
        run: |
          python -m ptm.report --list
          python -m ptm.report expenses v2 -o /tmp/bundle.json
          python -c "import json; b=json.load(open('/tmp/bundle.json'));             assert b['summary']['flips'], 'bundle carries no flips';             assert b['caveats'], 'bundle lost its caveats';             print(len(b), 'sections,', len(b['flips']), 'flips')"
          python -m ptm.report expenses v2 --csv -o /tmp/flips.csv
          python -m ptm.prune --dry-run
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"

  dags:
    name: DAGs parse under Airflow 3.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow 3.1 and providers
        run: pip install -r requirements.txt pytest

      # Proves the install actually produced an importable Airflow. Without
      # this the DAG-parse tests below just skip, and the job reports success
      # having run none of them.
      - name: Airflow imports
        run: |
          python -c "import airflow; print('airflow', airflow.__version__)"
          python -c "import airflow.sdk; print('airflow.sdk ok')"
          python -c "from airflow.providers.standard.operators.hitl import HITLOperator; print('HITLOperator ok')"

      # Both configurations, because the LLM-backed branch imports operators the
      # offline branch never touches - so offline-only parsing proves half of it.
      - name: Parse with the offline judge
        run: python -m pytest tests/test_dags.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"
          PYTHONPATH: .
          PTM_REQUIRE_AIRFLOW: "1"

      - name: Parse with the LLM judge
        run: python -m pytest tests/test_dags.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "0"
          PYTHONPATH: .
          PTM_REQUIRE_AIRFLOW: "1"

      # The plugin is meant to be nothing but routing, which is why the read
      # models are covered without a web framework. Status codes, query bounds,
      # download headers and the exact URLs the page asks for only exist here.
      - name: Plugin routes
        run: python -m pytest tests/test_plugin.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"
          PYTHONPATH: .
          PTM_REQUIRE_PLUGIN: "1"

  dashboard:
    name: Diff Explorer renders in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow, the plugin's dependencies and Playwright
        run: |
          pip install -r requirements.txt pytest playwright
          playwright install --with-deps chromium

      # Every other job proves the data is right. None of them proves the page
      # renders it - a renderer reading a field the API no longer returns
      # leaves the suite green and the dashboard blank.
      - name: Load the dashboard and click through it
        run: python -m pytest tests/test_dashboard.py -q
        env:
          PTM_INCLUDE_DIR: ./include
          PTM_DB: ./include/ptm.db
          PTM_OFFLINE: "1"
          PYTHONPATH: .
          PTM_REQUIRE_BROWSER: "1"
