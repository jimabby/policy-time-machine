# Single-container Airflow 3.1 for the demo. Not a production topology.
services:
  airflow:
    build: .
    # Loopback, not every interface. The next block argues at length that a
    # login screen is the wrong thing for a demo and turns authentication off
    # for the whole UI - which is a fine trade for something reachable from the
    # laptop it runs on, and a different proposition entirely once Docker has
    # published it on 0.0.0.0. `8080:8080` did exactly that: the conference
    # wifi, the co-working LAN and anything else that could route to the host
    # got an Airflow with every visitor an admin, able to trigger DAGs and read
    # every case file through the Explorer.
    #
    # Binding to 127.0.0.1 keeps `docker compose up` followed by
    # http://localhost:8080/ptm/ working exactly as the README describes, and
    # is the cheaper half of the fix - PTM_OPEN_UI=false is the other, for a
    # deployment that genuinely wants to be reachable and therefore wants a
    # login. Override PTM_BIND to publish deliberately: PTM_BIND=0.0.0.0 to
    # show the Explorer to the room from somebody else's machine.
    ports: ["${PTM_BIND:-127.0.0.1}:8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      PYTHONPATH: /opt/airflow
      PTM_INCLUDE_DIR: /opt/airflow/include
      PTM_DB: /opt/airflow/include/ptm.db
      # 1 = no API key needed; the offline judge stands in for the LLM.
      PTM_OFFLINE: "${PTM_OFFLINE:-1}"
      PTM_LLM_CONN_ID: "${PTM_LLM_CONN_ID:-pydanticai_default}"
      # Priced, not selected: this is the model the cost ledger quotes. The
      # model actually called comes from the connection below.
      PTM_JUDGE_MODEL: "${PTM_JUDGE_MODEL:-anthropic:claude-sonnet-5}"
      PTM_PRICE: "${PTM_PRICE:-}"
      # The verdict cache, on by default. 0 stops reads without stopping writes;
      # the epoch is mixed into every key, so bumping it stops every earlier
      # answer being served while leaving the entries on disk. Both are levers a
      # reader is told about in .env.example and in the README - and neither
      # reached the container until they were named here. Compose reads .env for
      # ${...} interpolation but only passes what this block declares, so setting
      # either one and running `make up` did exactly nothing, silently, which is
      # the worst way for a documented switch to be off.
      PTM_CACHE: "${PTM_CACHE:-1}"
      PTM_CACHE_EPOCH: "${PTM_CACHE_EPOCH:-}"
      # Opens the Diff Explorer to anyone who can reach the port. Default empty,
      # which is the same as off: the plugin authenticates every route against
      # Airflow's own token and logging into the UI is all a reader needs. Listed
      # for the same reason as the two above - a documented escape hatch that
      # cannot be reached is worse than one that does not exist, because somebody
      # sets it, sees the login, and concludes the auth cannot be turned off.
      PTM_ALLOW_ANONYMOUS: "${PTM_ALLOW_ANONYMOUS:-}"
      # Where `ptm report <domain> <version> --html` finds the Explorer page to
      # fill in. Empty means the copy beside this repository's plugins/ folder,
      # which is what the mount below puts there and is right for every ordinary
      # run. Declared rather than left implicit for the same reason as the three
      # above: an image that has moved the page needs a lever that reaches the
      # container, and a lever that does not is worse than none.
      PTM_DASHBOARD: "${PTM_DASHBOARD:-}"
      # Only read when PTM_OFFLINE=0.
      AIRFLOW_CONN_PYDANTICAI_DEFAULT: "${AIRFLOW_CONN_PYDANTICAI_DEFAULT:-}"
      # No login, and that is a deliberate choice for a demo rather than an
      # oversight. What was here before was _AIRFLOW_WWW_USER_USERNAME and
      # _AIRFLOW_WWW_USER_PASSWORD set to admin/admin, which is what an Airflow 2
      # image reads and what the README, the Makefile and the demo script all
      # promised. Airflow 3.1 has no `airflow users` command and no FAB user
      # table: the default SimpleAuthManager generates a random password into
      # $AIRFLOW_HOME/simple_auth_manager_passwords.json.generated, prints it
      # once into the startup logs, and - because AIRFLOW_HOME is not on a
      # volume here - generates a different one every `docker compose up`. So
      # the documented credential did not work, and the working one was a line
      # of log output nobody was told to look for.
      #
      # all_admins is what Airflow provides for exactly this: no login screen,
      # everybody an admin. It keeps the Diff Explorer working, which matters
      # more here than it looks - the plugin authenticates every one of its own
      # routes against Airflow's token, and SimpleAllAdminMiddleware appends a
      # bearer token to every request before routing, so the plugin resolves it
      # exactly as it resolves a real session.
      #
      # This is a single-container demo with no data anybody else's. A
      # deployment sets simple_auth_manager_users and a passwords file, or an
      # auth manager that is not this one.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "${PTM_OPEN_UI:-true}"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./include:/opt/airflow/include
      - ./ptm:/opt/airflow/ptm
      # The DAG *builders*, one module per DAG. Mounted next to the engine and
      # imported off PYTHONPATH rather than living under dags/, because the
      # dags folder is only reliably on sys.path when Airflow itself put it
      # there - which is not true of a DagBag pointed straight at a directory,
      # as the DAG-parse tests do. /opt/airflow is on PYTHONPATH for both.
      - ./ptm_dags:/opt/airflow/ptm_dags
      - airflow-home:/opt/airflow/logs
    command: >
      bash -c "python -m ptm.seed && exec airflow standalone"
    # What "ready" means, so something other than a person watching the logs can
    # decide it. `docker compose up -d` returns as soon as the container starts,
    # which is a good half-minute before `airflow standalone` has migrated the
    # metadata database, parsed the DAGs and mounted the plugin - so the README's
    # "once ready, open the Diff Explorer" was an instruction to keep refreshing.
    # The probe asks the plugin's own route rather than Airflow's health
    # endpoint: the Explorer is the thing being waited for, and it is mounted
    # last, so an answer here means the whole stack including this project's
    # part of it. start_period covers the migration without counting those
    # attempts as failures. `make up` waits on this, and so does the CI smoke job.
    #
    # 401 and 403 count as ready, and that is not a loosening. The plugin
    # authenticates every route, so with PTM_OPEN_UI=false a probe that demanded
    # 200 would mark a perfectly healthy stack unhealthy forever and `make up`
    # would fail for the one person who locked it down. What is being waited for
    # is the route existing and answering; who may read it is a different
    # question and one this project answers elsewhere. Connection refused or a
    # 404 still means not ready, which is the distinction that matters.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import http.client as h; c = h.HTTPConnection('localhost', 8080, timeout=5); c.request('GET', '/ptm/api/domains'); raise SystemExit(0 if c.getresponse().status in (200, 401, 403) else 1)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  airflow-home:
