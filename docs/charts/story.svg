<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 232" width="824" height="232" role="img" aria-labelledby="t d"><title id="t">What a 600-case replay found</title><desc id="d">A changed answer is not automatically the proposal's doing - the replay judges the old rulebook too.</desc><rect x="0" y="0" width="824" height="232" fill="#fcfcfb" rx="10" ry="10"/><g transform="translate(28,24)"><text x="0" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">What a 600-case replay found</text><text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">A changed answer is not automatically the proposal's doing - the replay judges the old rulebook too.</text><rect x="0" y="84" width="137.52" height="54" fill="#2a78d6" rx="4" ry="4"/><text x="68.76" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">109</text><rect x="139.52" y="84" width="46.64" height="54" fill="#eb6834" rx="4" ry="4"/><text x="162.84" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">38</text><rect x="188.16" y="84" width="577.84" height="54" fill="#dcdbd4" rx="4" ry="4"/><text x="477.08" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#000000" text-anchor="middle">453</text><line x1="0" y1="72" x2="186.16" y2="72" stroke="#52514e" stroke-width="1.5" stroke-linecap="butt"/><line x1="0" y1="72" x2="0" y2="79" stroke="#52514e" stroke-width="1.5" stroke-linecap="butt"/><line x1="186.16" y1="72" x2="186.16" y2="79" stroke="#52514e" stroke-width="1.5" stroke-linecap="butt"/><text x="0" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">147 of 600 decisions come out differently (24.5%)</text><text x="0" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">net GBP 14,224 attributable to the proposal</text><circle cx="5" cy="194" r="5" fill="#2a78d6"/><text x="16" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">caused by policy v2</text><circle cx="156.4" cy="194" r="5" fill="#eb6834"/><text x="167.4" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">reviewer already departed from v1</text><circle cx="400.2" cy="194" r="5" fill="#dcdbd4"/><text x="411.2" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">unchanged</text></g></svg>
