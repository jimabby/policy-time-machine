<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 216" width="824" height="216" role="img" aria-labelledby="t d"><title id="t">What this much history simply cannot tell you</title><desc id="d">Sampling error alone, at 95% confidence and 80% power - a judge that contradicts itself moves the answer further.</desc><rect x="0" y="0" width="824" height="216" fill="#fcfcfb" rx="10" ry="10"/><g transform="translate(28,24)"><text x="0" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">What this much history simply cannot tell you</text><text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Sampling error alone, at 95% confidence and 80% power - a judge that contradicts itself moves the answer further.</text><rect x="318.29" y="86" width="215.91" height="44" fill="#2a78d6" rx="4" ry="4" opacity="0.16"/><line x1="40" y1="108" x2="740" y2="108" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt"/><line x1="40" y1="108" x2="40" y2="115" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt"/><text x="40" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">0%</text><line x1="195.56" y1="108" x2="195.56" y2="115" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt"/><text x="195.56" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">10%</text><line x1="351.11" y1="108" x2="351.11" y2="115" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt"/><text x="351.11" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">20%</text><line x1="506.67" y1="108" x2="506.67" y2="115" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt"/><text x="506.67" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">30%</text><line x1="662.22" y1="108" x2="662.22" y2="115" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt"/><text x="662.22" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">40%</text><line x1="421.11" y1="82" x2="421.11" y2="134" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="421.11" cy="108" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="421.11" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">measured 24.5%</text><text x="318.29" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">17.9%</text><text x="534.2" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">31.8%</text><text x="40" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">anything inside this band is this sample's noise: 600 cases cannot separate 24.5% from 31.8%</text></g></svg>
