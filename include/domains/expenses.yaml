name: expenses
label: employee expense reimbursement
impact_field: amount_gbp
impact_unit: "GBP"

# Ordered most generous -> most strict. This ordering is the only thing that
# lets the engine call a flip "loosening" or "tightening" without knowing
# anything about expenses.
outcomes: [approve, partial, deny]

policies:
  v1: policies/expenses/v1.md
  v2: policies/expenses/v2.md

case_template: |
  Claim ID:            {case_id}
  Submitted by:        {submitted_by}
  Employee grade:      {grade}
  Category:            {category}
  Amount:              GBP {amount_gbp}
  Receipt on file:     {receipt}
  Days notice given:   {days_notice}
  Director approval:   {director_approval}
  Alcohol included:    {alcohol}
  Client-driven:       {client_driven}
  Employee's note:     {note}

judge_instructions: |
  - "partial" means the claim is reimbursed only up to the applicable cap or
    only for the compliant portion. Use it whenever the policy caps rather
    than refuses.
  - The employee's grade shown above is their grade ON THE DATE OF THE CLAIM.
    It may not be their grade today. Use only the value shown.

review:
  max_reviews: 8
  below_confidence: 0.75
  above_impact: 400
  always_review_directions: [loosening]
  # Deviations are the largest flips by money and would otherwise take the
  # whole queue, leaving the proposal itself unreviewed. Two of the eight
  # slots is enough to keep settling them without crowding it out.
  max_deviation_reviews: 2
  # Keep flips the judge would not reproduce out of the human queue. Needs a
  # confirmation pass (judge_stability with target=flips); with nothing
  # measured, nothing is excluded.
  exclude_unstable: true

# Who the change lands on. grade is the point-in-time fact, so this segment is
# resolved as of each claim's own date - not as of today.
segment_fields: [category, grade]

# Two rulings on materially identical claims that disagree are a human
# inconsistency, not a policy bug. Amount is banded so GBP 104 and GBP 111 count
# as the same kind of claim; note and submitted_by are deliberately excluded.
conflicts:
  key: [category, receipt, director_approval, amount_gbp]
  impact_band: 250

# How far the offline rules may drift from the judge before the threshold sweep
# built on them stops being trustworthy. The sweep is arithmetic over these
# rules, so it is worth exactly what they are worth - and until this existed,
# nothing acted on the number that says so.
#
# 'warn' rather than 'fail' because offline the figure is 100% by construction
# (the verdicts being scored against came from these same rules), so the gate is
# inert here by design and only starts meaning anything with PTM_OFFLINE=0.
# Raise it to 'fail' once you have run a real judge and know what the agreement
# actually is.
rules:
  min_outcome_agreement: 0.9
  min_clause_agreement: 0.85
  gate: warn

# Fixtures for PTM_OFFLINE=1 so the demo runs with no API key. The real judge
# reads the markdown policy instead; these are a stand-in for it.
offline_rules:
  v1:
    - when: "amount_gbp > 500 and director_approval == 'no'"
      outcome: deny
      clause: "5.1"
      because: "Claims above GBP 500 require prior director approval, which is absent."
    - when: "category == 'travel' and days_notice < 7 and director_approval == 'no'"
      outcome: deny
      clause: "3.1"
      because: "Travel booked inside 7 days requires prior written approval."
    - when: "amount_gbp > 25 and receipt == 'no'"
      outcome: deny
      clause: "1.1"
      because: "No receipt on file and the claim exceeds the GBP 25 receipt threshold."
    - when: "category == 'meals' and amount_gbp > 40"
      outcome: partial
      clause: "2.1"
      confidence: 0.95
      because: "Meals are reimbursed up to the GBP 40 daily cap; the excess is not payable."
    - when: "alcohol == 'yes'"
      outcome: partial
      clause: "4.1"
      because: "Alcohol is excluded; the remainder of the claim is payable."
  v2:
    - when: "amount_gbp > 1000 and director_approval == 'no'"
      outcome: deny
      clause: "5.1"
      because: "Claims above the raised GBP 1000 threshold still require director approval."
    - when: "category == 'travel' and days_notice < 7 and director_approval == 'no' and client_driven == 'no'"
      outcome: deny
      clause: "3.1"
      because: "Short-notice travel without a client-driven reason still requires prior approval."
    - when: "amount_gbp > 75 and receipt == 'no' and grade < 3"
      outcome: deny
      clause: "1.1"
      confidence: 0.7
      because: "Above the raised GBP 75 receipt threshold, and the grade 3 exemption does not apply."
    - when: "category == 'meals' and amount_gbp > 60"
      outcome: partial
      clause: "2.1"
      confidence: 0.95
      because: "Meals are reimbursed up to the raised GBP 60 daily cap."
    - when: "alcohol == 'yes'"
      outcome: partial
      clause: "4.1"
      because: "Alcohol remains excluded under the proposed policy."
    # Placed last so the meals cap and the alcohol exclusion still bite for
    # senior staff: the exemption is from receipts only. Without this rule the
    # exemption shows up as an unattributed approval, which hides the single
    # biggest driver of change in the whole proposal.
    - when: "amount_gbp > 75 and receipt == 'no' and grade >= 3"
      outcome: approve
      clause: "6.1"
      confidence: 0.9
      because: "Grade 3+ is exempt from the receipt requirement in clause 1.1."
pit_field: grade
