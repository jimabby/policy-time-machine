name: refunds
label: gym membership cancellation refund
impact_field: outstanding_balance_gbp
impact_unit: "GBP"
outcomes: [full_refund, partial_refund, no_refund]

policies:
  v1: policies/refunds/v1.md
  v2: policies/refunds/v2.md

case_template: |
  Case ID:              {case_id}
  Member:               {member}
  Membership tier:      {tier}
  Months elapsed:       {months_elapsed} of {contract_months}
  Notice given (days):  {notice_days}
  Stated reason:        {reason}
  Distance moved (mi):  {distance_moved_miles}
  Documentation:        {documentation}
  Outstanding balance:  GBP {outstanding_balance_gbp}
  Member's note:        {note}

judge_instructions: |
  - "partial_refund" means the final month is charged and the remainder
    returned. Use it wherever the policy charges rather than forfeits.
  - The membership tier shown is the tier ON THE DATE OF CANCELLATION, which
    may differ from the member's tier today. Use only the value shown.

review:
  max_reviews: 8
  below_confidence: 0.75
  above_impact: 300
  always_review_directions: [loosening]
  max_deviation_reviews: 2
  exclude_unstable: true

# tier is the point-in-time fact here, captured as of the cancellation date.
segment_fields: [reason, tier]

conflicts:
  key: [reason, documentation, contract_months, outstanding_balance_gbp]
  impact_band: 200


# How far the offline rules may drift from the judge before the threshold sweep
# built on them stops being trustworthy. The sweep is arithmetic over these
# rules, so it is worth exactly what they are worth - and until this existed,
# nothing acted on the number that says so.
#
# 'warn' rather than 'fail' because offline the figure is 100% by construction
# (the verdicts being scored against came from these same rules), so the gate is
# inert here by design and only starts meaning anything with PTM_OFFLINE=0.
# Raise it to 'fail' once you have run a real judge and know what the agreement
# actually is.
rules:
  min_outcome_agreement: 0.9
  min_clause_agreement: 0.85
  gate: warn

# How wrong the judge may be about the cases humans have already settled. The
# only measurement here that scores the judge against an answer rather than
# against itself - every other check is satisfied by a judge that misreads a
# clause the same way every time.
#
# require_threshold_separation is the one worth understanding. review.
# below_confidence above routes the scarcest resource in this project - human
# attention - on the judge's own claim about how sure it is. If verdicts above
# that line are right no more often than the ones below it, that queue is being
# picked at random, and so was every precedent established from it.
#
# 'warn' for the same reason the rules gate is: offline these verdicts come from
# offline_rules, so the figure describes the fixture and the gate is held off
# entirely. Raise it to 'fail' once a real judge has been scored.
calibration:
  min_accuracy: 0.7
  max_overconfidence: 0.15
  require_threshold_separation: true
  min_judged: 10
  gate: warn

offline_rules:
  v1:
    - when: "months_elapsed < contract_months and reason == 'medical' and documentation == 'yes'"
      outcome: full_refund
      clause: "3.1"
      because: "Documented medical reason waives the minimum-term forfeit."
    - when: "months_elapsed < contract_months and reason == 'relocation' and documentation == 'yes' and distance_moved_miles > 25"
      outcome: full_refund
      clause: "3.2"
      because: "Documented relocation beyond 25 miles waives the forfeit."
    - when: "months_elapsed < contract_months"
      outcome: no_refund
      clause: "2.1"
      because: "Cancellation inside the minimum term forfeits the balance."
    - when: "notice_days < 30"
      outcome: partial_refund
      clause: "1.1"
      because: "Short notice: the final month is charged, the remainder refunded."
    - when: "months_elapsed >= contract_months and notice_days >= 30"
      outcome: full_refund
      clause: "4.1"
      confidence: 0.9
      because: "Outside the minimum term with 30 days' notice: full refund."
  v2:
    - when: "months_elapsed < contract_months and reason == 'medical' and documentation == 'yes'"
      outcome: full_refund
      clause: "3.1"
      because: "Documented medical reason waives the forfeit."
    - when: "months_elapsed < contract_months and reason == 'relocation' and documentation == 'yes' and distance_moved_miles > 15"
      outcome: full_refund
      clause: "3.2"
      because: "Documented relocation beyond the reduced 15-mile threshold waives the forfeit."
    - when: "months_elapsed < contract_months and tier == 'premium'"
      outcome: full_refund
      clause: "5.1"
      confidence: 0.7
      because: "Premium-tier members are exempt from the minimum-term forfeit."
    - when: "months_elapsed < contract_months"
      outcome: no_refund
      clause: "2.1"
      because: "Cancellation inside the minimum term still forfeits the balance."
    - when: "notice_days < 14"
      outcome: partial_refund
      clause: "1.1"
      because: "Below the reduced 14-day notice threshold, the final month is charged."
    # Explicit rather than falling through to the default outcome, so that a
    # clean out-of-term cancellation is attributed to the clause that decides it.
    - when: "months_elapsed >= contract_months and notice_days >= 14"
      outcome: full_refund
      clause: "4.1"
      confidence: 0.9
      because: "Outside the minimum term with proper notice: full refund."
pit_field: tier
