<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0; background: radial-gradient(circle at 50% 30%, #1e3a70 0%, #0b1020 75%);
    color: #eef3ff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-sizing: border-box; padding: 40px; text-align: center;
  }
  .tag {
    color: #77a7ff; font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 18px;
  }
  h1 {
    font-size: 64px; font-weight: 800; margin: 0 0 20px; letter-spacing: -0.02em; line-height: 1.15;
  }
  p.lead {
    font-size: 26px; color: #9ba8c3; max-width: 950px; margin: 0 auto 52px; line-height: 1.5;
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; width: 1160px; margin-bottom: 52px;
  }
  .stat-card {
    background: rgba(18, 26, 45, 0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 26px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }
  .stat-val {
    font-size: 48px; font-weight: 800; color: #eef3ff; margin-bottom: 6px; font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 14px; color: #9ba8c3; text-transform: uppercase; letter-spacing: 0.05em; }
  .cta-container {
    display: flex; gap: 20px; justify-content: center; align-items: center;
  }
  .cta-box {
    background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px 32px;
    display: inline-flex; align-items: center; gap: 14px; font-family: ui-monospace, monospace;
    font-size: 20px; color: #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="tag">Policy Time Machine</div>
<h1>Would you ship this rule?</h1>
<p class="lead">Try tomorrow's rules on yesterday's decisions—before tomorrow becomes a surprise.</p>
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-val">600</div>
    <div class="stat-label">Cases Replayed</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" style="color:#f9c75d">147</div>
    <div class="stat-label">Different Answers</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" style="color:#77a7ff">109</div>
    <div class="stat-label">Caused by Proposal</div>
  </div>
  <div class="stat-card">
    <div class="stat-val" style="color:#48d597">8</div>
    <div class="stat-label">Precedents Guarded</div>
  </div>
</div>
<div class="cta-container">
  <div class="cta-box">
    <span style="color:#64748b">$</span> python demo.py --step
  </div>
  <div class="cta-box">
    <span style="color:#64748b">$</span> python manage.py coverage expenses v2
  </div>
</div>
</body>
</html>
